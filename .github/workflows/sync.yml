name: Sync from Gitee

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror from Gitee
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "HEAD:.github/workflows/sync.yml" > /tmp/sync.yml
          git remote add gitee https://gitee.com/tuling-python/web-reverse-mcps-tool.git
          git fetch --no-tags gitee main
          if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD^ 2>/dev/null || echo none)" ]; then
            echo "Gitee branch is already mirrored"
            exit 0
          fi
          git reset --hard FETCH_HEAD
          mkdir -p .github/workflows
          cp /tmp/sync.yml .github/workflows/sync.yml
          git add .github/workflows/sync.yml
          git commit -m "chore: sync from gitee"
          git push --force origin "HEAD:main"
