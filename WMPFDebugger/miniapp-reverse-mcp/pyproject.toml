[project]
name = "miniapp-reverse-mcp"
version = "0.1.6"
description = "WMPF reverse engineering MCP server for WeChat Mini Program CDP debugging"
requires-python = ">=3.11"
dependencies = [
    "cdp-use",
    "mcp>=1.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniapp_cdp"]

[project.scripts]
miniapp-reverse-mcp = "miniapp_cdp.server:main"
